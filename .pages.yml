# Prime-Clean — Pages CMS
# A configuracao e lida por repositorio e por branch. O login no Pages CMS nao
# substitui a instalacao e a autorizacao da GitHub App neste repositorio.
media:
  - name: servicos
    label: Fotos dos serviços
    input: media/fotos-servicos
    output: /media/fotos-servicos
    extensions: [webp, jpg, jpeg, png]
    rename: safe
    commit:
      templates:
        create: "cms: adicionar foto de serviço {filename}"
        update: "cms: atualizar foto de serviço {filename}"
        delete: "cms: remover foto de serviço {filename}"
        rename: "cms: renomear foto de serviço {oldFilename} para {newFilename}"

  - name: comparacoes
    label: Fotos de antes e depois
    input: media/comparacoes
    output: /media/comparacoes
    extensions: [webp, jpg, jpeg, png]
    rename: safe
    commit:
      templates:
        create: "cms: adicionar foto de comparação {filename}"
        update: "cms: atualizar foto de comparação {filename}"
        delete: "cms: remover foto de comparação {filename}"
        rename: "cms: renomear foto de comparação {oldFilename} para {newFilename}"

content:
  - name: site
    label: Contatos e área de atendimento
    type: file
    path: data/site.json
    format: json
    fields:
      - name: instagram
        label: URL do Instagram informado
        type: string
        description: "Informe a URL completa. Confirme a titularidade antes de apresentá-la como perfil oficial."
      - name: whatsapp
        label: WhatsApp validado
        type: string
        description: "Deixe vazio até confirmar que a conta recebe mensagens. Depois, use somente DDI, DDD e número, sem símbolos."
      - name: area
        label: Área de atendimento
        type: string
        required: true
        options:
          maxlength: 160

  - name: servicos
    label: Serviços
    type: file
    path: data/servicos.json
    format: json
    list: true
    fields:
      - name: title
        label: Título
        type: string
        required: true
        options:
          maxlength: 100
      - name: description
        label: Descrição
        type: text
        required: true
      - name: image
        label: Foto do serviço
        type: image
        description: "Use apenas imagem autorizada. Fotos ilustrativas não podem aparecer como resultado real."
        options:
          media: servicos
          extensions: [webp, jpg, jpeg, png]
          rename: safe
      - name: imageAlt
        label: Descrição da imagem (acessibilidade)
        type: string
        required: true
        options:
          maxlength: 180
      - name: illustrative
        label: Imagem ilustrativa
        type: boolean
        default: true
        description: "Ative para imagens geradas ou de referência que não registram um atendimento real."
      - name: order
        label: Ordem
        type: number
        required: true
        options:
          min: 1
          max: 99
      - name: visible
        label: Exibir no site
        type: boolean
        default: true

  - name: comparacoes
    label: Trabalhos (antes e depois)
    type: file
    path: data/comparacoes.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: Título do trabalho
        type: string
        required: true
        options:
          maxlength: 120
      - name: service
        label: Categoria ou serviço
        type: string
        required: true
        description: "Ex.: higienização de sofá, colchão ou cadeira."
        options:
          maxlength: 100
      - name: description
        label: Descrição do resultado
        type: text
      - name: before
        label: Foto antes
        type: image
        required: true
        options:
          media: comparacoes
          extensions: [webp, jpg, jpeg, png]
          rename: safe
      - name: beforeAlt
        label: Descrição da foto antes (acessibilidade)
        type: string
        required: true
        options:
          maxlength: 180
      - name: after
        label: Foto depois
        type: image
        required: true
        options:
          media: comparacoes
          extensions: [webp, jpg, jpeg, png]
          rename: safe
      - name: afterAlt
        label: Descrição da foto depois (acessibilidade)
        type: string
        required: true
        options:
          maxlength: 180
      - name: order
        label: Ordem
        type: number
        required: true
        options:
          min: 1
          max: 999
      - name: demonstrative
        label: Simulação gerada por IA
        type: boolean
        default: false
        description: "Ative somente em comparações inteiramente sintéticas, sem fotos ou clientes reais. O site identifica o registro como simulação."
      - name: consentConfirmed
        label: Consentimento confirmado
        type: boolean
        default: false
        description: "Para fotos reais, exige autorização para publicar as duas fotos. Mantenha falso para imagens totalmente sintéticas."
      - name: published
        label: Exibir no site
        type: boolean
        default: false
        description: "Publique apenas pares completos: trabalhos reais com consentimento, ou simulações explícitas geradas por IA."

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "cms: adicionar {path}"
      update: "cms: atualizar {path}"
      delete: "cms: remover {path}"
      rename: "cms: renomear {oldPath} para {newPath}"
