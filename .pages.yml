# Prime-Clean — demonstração do Pages CMS em projeto fictício
# A configuracao e lida por repositorio e por branch. O login no Pages CMS nao
# substitui a instalacao e a autorizacao da GitHub App neste repositorio.
media:
  - name: servicos
    label: Fotos dos serviços
    input: media/fotos-servicos
    output: /media/fotos-servicos
    extensions: [webp, jpg, jpeg, png]
    rename: safe
    commit:
      templates:
        create: "cms: adicionar foto de serviço {filename}"
        update: "cms: atualizar foto de serviço {filename}"
        delete: "cms: remover foto de serviço {filename}"
        rename: "cms: renomear foto de serviço {oldFilename} para {newFilename}"

  - name: comparacoes
    label: Fotos de antes e depois
    input: media/comparacoes
    output: /media/comparacoes
    extensions: [webp, jpg, jpeg, png]
    rename: safe
    commit:
      templates:
        create: "cms: adicionar foto de comparação {filename}"
        update: "cms: atualizar foto de comparação {filename}"
        delete: "cms: remover foto de comparação {filename}"
        rename: "cms: renomear foto de comparação {oldFilename} para {newFilename}"

content:
  - name: site
    label: Campos institucionais (demonstração)
    type: file
    path: data/site.json
    format: json
    fields:
      - name: instagram
        label: Instagram (manter vazio no portfólio)
        type: string
        description: "Campo preservado apenas para demonstrar o schema. O protótipo não publica contatos externos."
      - name: whatsapp
        label: WhatsApp (manter vazio no portfólio)
        type: string
        description: "Campo preservado apenas para demonstrar o schema. O protótipo não cria links comerciais."
      - name: area
        label: Contexto exibido no rodapé
        type: string
        required: true
        options:
          maxlength: 160

  - name: servicos
    label: Serviços demonstrativos
    type: file
    path: data/servicos.json
    format: json
    list: true
    fields:
      - name: title
        label: Título
        type: string
        required: true
        options:
          maxlength: 100
      - name: description
        label: Descrição
        type: text
        required: true
      - name: image
        label: Imagem ilustrativa do cartão
        type: image
        description: "Use somente mídia local autorizada e identifique imagens geradas por IA."
        options:
          media: servicos
          extensions: [webp, jpg, jpeg, png]
          rename: safe
      - name: imageAlt
        label: Descrição da imagem (acessibilidade)
        type: string
        required: true
        options:
          maxlength: 180
      - name: illustrative
        label: Imagem ilustrativa ou gerada por IA
        type: boolean
        default: true
        description: "Ative para imagens geradas ou de referência que não registram um atendimento real."
      - name: order
        label: Ordem
        type: number
        required: true
        options:
          min: 1
          max: 99
      - name: visible
        label: Exibir no site
        type: boolean
        default: true

  - name: comparacoes
    label: Comparações demonstrativas
    type: file
    path: data/comparacoes.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: Título do trabalho
        type: string
        required: true
        options:
          maxlength: 120
      - name: service
        label: Categoria ou serviço
        type: string
        required: true
        description: "Ex.: higienização de sofá, colchão ou cadeira."
        options:
          maxlength: 100
      - name: description
        label: Descrição do resultado
        type: text
      - name: before
        label: Foto antes
        type: image
        required: true
        options:
          media: comparacoes
          extensions: [webp, jpg, jpeg, png]
          rename: safe
      - name: beforeAlt
        label: Descrição da foto antes (acessibilidade)
        type: string
        required: true
        options:
          maxlength: 180
      - name: after
        label: Foto depois
        type: image
        required: true
        options:
          media: comparacoes
          extensions: [webp, jpg, jpeg, png]
          rename: safe
      - name: afterAlt
        label: Descrição da foto depois (acessibilidade)
        type: string
        required: true
        options:
          maxlength: 180
      - name: order
        label: Ordem
        type: number
        required: true
        options:
          min: 1
          max: 999
      - name: demonstrative
        label: Simulação gerada por IA
        type: boolean
        default: false
        description: "Ative somente em comparações inteiramente sintéticas, sem fotos ou clientes reais. O site identifica o registro como simulação."
      - name: consentConfirmed
        label: Confirmação editorial do registro
        type: boolean
        default: false
        description: "Mantenha falso nas simulações sintéticas. O campo demonstra o schema e não constitui prova jurídica de consentimento."
      - name: published
        label: Exibir na demonstração
        type: boolean
        default: false
        description: "Use somente um par local, completo, inteiramente sintético e claramente identificado como simulação gráfica."

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "cms: adicionar {path}"
      update: "cms: atualizar {path}"
      delete: "cms: remover {path}"
      rename: "cms: renomear {oldPath} para {newPath}"
