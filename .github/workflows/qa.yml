name: QA automatizado

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Validar conteúdo e imagens
        run: python3 scripts/validar_conteudo.py

      - name: Auditar referências e mídias órfãs
        run: python3 scripts/auditar_midias.py

      - name: Testar fixtures do validador
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Verificar sintaxe do JavaScript
        run: |
          node --check app.js
          node --check public-content.mjs
          node --check worker/index.mjs

      - name: Testar adaptador público e Worker
        run: |
          node --test tests/public-content.test.mjs
          node scripts/build_public.mjs

  painel-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Instalar dependências fixadas
        run: npm ci

      - name: Testar autenticação e configuração
        run: npm test

      - name: Gerar e auditar o build
        run: npm run build
